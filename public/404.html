<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>Page not found | ERTA</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --surface: #0d1626;
      --text: #f5f7fb;
      --muted: #b7c3d8;
      --accent: #5ea6ff;
      --accent-strong: #19d3c5;
      --border: rgba(111, 160, 229, 0.2);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(94, 166, 255, 0.16), transparent 32%),
        radial-gradient(circle at 85% 90%, rgba(25, 211, 197, 0.1), transparent 28%),
        var(--bg);
      font-family: "Rajdhani", "Bahnschrift", "Arial Narrow", system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(180deg, #000, transparent 70%);
    }
    main {
      position: relative;
      width: min(100%, 720px);
      padding: clamp(2rem, 5vw, 3.5rem);
      border: 1px solid var(--border);
      border-radius: 5px;
      background: linear-gradient(180deg, rgba(16, 23, 38, 0.96), rgba(11, 16, 29, 0.92));
      box-shadow: 0 22px 56px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    main::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, rgba(94, 166, 255, 0.85), rgba(25, 211, 197, 0.85));
    }
    .brand { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 2rem; }
    .brand img { width: 56px; height: 56px; border-radius: 4px; }
    .brand span { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.3em; }
    .code {
      margin: 0;
      font-size: clamp(5rem, 16vw, 9rem);
      font-weight: 700;
      line-height: 0.8;
      color: transparent;
      -webkit-text-stroke: 1px rgba(169, 216, 246, 0.5);
    }
    h1 {
      margin: 1.5rem 0 0.6rem;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      line-height: 1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
    .pt { margin-top: 0.9rem; font-size: 0.92rem; opacity: 0.75; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 2rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.3rem;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
    }
    .primary {
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.32);
      background: linear-gradient(135deg, var(--accent), #0f4ca8 62%, rgba(25, 211, 197, 0.92));
    }
    .secondary { color: var(--text); border: 1px solid var(--border); }
    :focus-visible { outline: 2px solid rgba(94, 166, 255, 0.84); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/logo.png" alt="ERTA" />
      <span>ERTA</span>
    </div>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>The page you’re looking for doesn’t exist or has moved. Go back to the homepage or see the FSPT26 results.</p>
    <p class="pt" lang="pt">A página que procuras não existe ou foi movida.</p>
    <div class="actions">
      <a class="primary" href="/">Back to home</a>
      <a class="secondary" href="/results">See results</a>
    </div>
  </main>
</body>
</html>
